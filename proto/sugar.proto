syntax = "proto3";

package sugar.v1;

import "google/protobuf/timestamp.proto";

service Sugar {
  rpc Subscribe(SubscribeRequest) returns (stream Update);
}

message SubscribeRequest {
  map<string, Filter> filters = 1;
}

message Filter {
  repeated bytes writes = 1;
  repeated bytes accounts = 2;
  repeated bytes signers = 3;
  // Top-level instructions: the program and how its data begins.
  repeated Instruction instructions = 4;
  // Names from sugar's catalog: `pump_fun.buy`, an action such as `create`, or a venue such as `pump_swap`.
  repeated string actions = 5;
}

message Instruction {
  bytes program = 1;
  // Prefix of the instruction data, at most 32 bytes. Empty matches every instruction of the program.
  bytes discriminator = 2;
}

message Update {
  oneof update {
    SlotOpened slot = 1;
    Transaction transaction = 2;
  }
}

message SlotOpened {
  uint64 slot = 1;
  bytes leader = 2;
}

message Transaction {
  uint64 slot = 1;
  uint32 index = 2;
  bytes leader = 3;
  bytes signature = 4;
  bytes payload = 5;
  repeated string filters = 6;
  google.protobuf.Timestamp received_at = 7;
}
